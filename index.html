<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>masca</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="prevMonth" class="icon-btn" aria-label="이전 달">‹</button>
    <h1 id="monthLabel">2026년 1월</h1>
    <button id="nextMonth" class="icon-btn" aria-label="다음 달">›</button>
    <button id="settingsBtn" class="icon-btn settings" aria-label="설정">⚙</button>
  </header>

  <div class="weekdays">
    <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
  </div>
  <div id="calendar" class="calendar"></div>

  <div id="summary" class="summary-card">
    <div class="summary-row">
      <span class="summary-label" id="summaryLabel">이번 달 급여 (공제 전)</span>
      <button id="toggleNet" class="toggle-btn">3.3% 공제 후 보기</button>
    </div>
    <div id="summaryAmount" class="summary-amount">0원</div>
    <div id="payDate" class="pay-date"></div>
  </div>
</div>

<div id="entryModal" class="modal hidden">
  <div class="modal-card">
    <h2 id="entryDateLabel">날짜</h2>
    <label>시작 시간
      <input type="time" id="startTime" step="600">
    </label>
    <label>종료 시간
      <input type="time" id="endTime" step="600">
    </label>
    <div id="entryPreview" class="entry-preview"></div>
    <div class="modal-actions">
      <button id="deleteEntryBtn" class="btn btn-danger hidden">삭제</button>
      <button id="cancelEntryBtn" class="btn btn-ghost">취소</button>
      <button id="saveEntryBtn" class="btn btn-primary">저장</button>
    </div>
  </div>
</div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-card">
    <h2>설정</h2>
    <label>기본 시급 (원)
      <input type="number" id="wageInput" min="0" step="10">
    </label>
    <p class="hint">변경한 시급은 앞으로 새로 입력하는 근무 기록부터 적용되며, 이미 저장된 과거 기록의 금액은 바뀌지 않습니다.</p>
    <div class="modal-actions">
      <button id="cancelSettingsBtn" class="btn btn-ghost">취소</button>
      <button id="saveSettingsBtn" class="btn btn-primary">저장</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
